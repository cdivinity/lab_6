<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise & Sunset Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script async src="java.js"></script>
</head>
<body>
    <div class="container">
        <h1>Sunrise & Sunset Dashboard</h1>
        <div class="search-bar">
            <label for="location">Select Location:</label>
            <select id="location">
                <option value="">Select Location</option>
                <option value="New York">New York</option>
                <option value="London">London</option>
                <option value="Tokyo">Tokyo</option>
                <option value="Sydney">Sydney</option>
                <option value="Paris">Paris</option>
                <option value="Berlin">Berlin</option>
                <option value="Rome">Rome</option>
                <option value="Moscow">Moscow</option>
                <option value="Cairo">Cairo</option>
            </select>
            <button id="search-btn">Search</button>
        </div>
        <div class="results">
            <div class="today">
                <h2>Today</h2>
                <div class="data">
                    <div class="sunrise">Sunrise: <span id="today-sunrise"></span></div>
                    <div class="sunset">Sunset: <span id="today-sunset"></span></div>
                    <div class="dawn">Dawn: <span id="today-dawn"></span></div>
                    <div class="dusk">Dusk: <span id="today-dusk"></span></div>
                    <div class="day-length">Day Length: <span id="today-day-length"></span></div>
                    <div class="solar-noon">Solar Noon: <span id="today-solar-noon"></span></div>
                    <div class="timezone">Timezone: <span id="today-timezone"></span></div>
                </div>
            </div>
            <div class="tomorrow">
                <h2>Tomorrow</h2>
                <div class="data">
                    <div class="sunrise">Sunrise: <span id="tomorrow-sunrise"></span></div>
                    <div class="sunset">Sunset: <span id="tomorrow-sunset"></span></div>
                    <div class="dawn">Dawn: <span id="tomorrow-dawn"></span></div>
                    <div class="dusk">Dusk: <span id="tomorrow-dusk"></span></div>
                    <div class="day-length">Day Length: <span id="tomorrow-day-length"></span></div>
                    <div class="solar-noon">Solar Noon: <span id="tomorrow-solar-noon"></span></div>
                    <div class="timezone">Timezone: <span id="tomorrow-timezone"></span></div>
                </div>
            </div>
        </div>
        <div id="error-message"></div>
    </div>
